  // ============ COMPREHENSIVE FIX for API & Static Resource Proxy ============
  (function() {
    'use strict';
    var PROXY = 'https://give-experiences-businesses-publicly.trycloudflare.com';
    var BASE_PATH = '/ETH';

    function normalizeUrl(url) {
      if (typeof url !== 'string') return url;
      url = url.replace(/\/ETH\/ETH\//g, '/ETH/');
      url = url.replace(/\/static\/ETH\/static\//g, '/ETH/static/');
      return url;
    }

    function proxyUrl(url) {
      if (!PROXY || typeof url !== 'string') return normalizeUrl(url);
      if (url.indexOf(PROXY) !== -1) return url;

      if (url.startsWith('/') && !url.startsWith('//') && !url.startsWith('/static/') && !url.startsWith('/favicon')) {
        return PROXY + url;
      }

      if (url.match(/https?:\/\/localhost:3000/)) {
        var proxied = url.replace(/https?:\/\/localhost:3000/, PROXY);
        console.log('[PROXY] Redirect localhost:3000 -> ' + proxied);
        return proxied;
      }

      if (!url.match(/^https?:\/\//) && !url.startsWith('data:') && !url.startsWith('blob:')) {
        return PROXY + (url.startsWith('/') ? url : '/' + url);
      }

      return normalizeUrl(url);
    }

    // Intercept fetch
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      arguments[0] = proxyUrl(url);
      return origFetch.apply(this, arguments);
    };

    // Intercept XMLHttpRequest
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
      var args = Array.prototype.slice.call(arguments);
      args[1] = proxyUrl(url);
      return origOpen.apply(this, args);
    };

    // Intercept WebSocket
    var origWS = window.WebSocket;
    window.WebSocket = function(url, protocols) {
      if (typeof url === 'string') {
        if (url.startsWith('wss://cptmarketscoin-ctrl.github.io') ||
            url.startsWith('ws://cptmarketscoin-ctrl.github.io')) {
          url = 'wss://give-experiences-businesses-publicly.trycloudflare.com/ws/control';
        } else {
          url = proxyUrl(url);
          if (url.startsWith('http://')) url = url.replace('http://', 'ws://');
          if (url.startsWith('https://')) url = url.replace('https://', 'wss://');
        }
      }
      return protocols ? new origWS(url, protocols) : new origWS(url);
    };
    window.WebSocket.prototype = origWS.prototype;
    window.WebSocket.CONNECTING = origWS.CONNECTING;
    window.WebSocket.OPEN = origWS.OPEN;
    window.WebSocket.CLOSING = origWS.CLOSING;
    window.WebSocket.CLOSED = origWS.CLOSED;

    console.log('[PROXY] Comprehensive proxy installed, PROXY=' + PROXY);
  })();
