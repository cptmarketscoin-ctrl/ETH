  <script>
  // ============ API &amp; WebSocket Proxy with Rate Limiting ============
  (function() {
    'use strict';
    var PROXY = 'https://api.cptnexus.sbs';
    var BASE_PATH = '/ETH';

    // Rate limiting: prevent 429 errors
    var requestQueue = [];
    var lastRequestTime = 0;
    var MIN_INTERVAL = 150; // 150ms between requests
    
    function processQueue() {
      if (requestQueue.length === 0) return;
      
      var now = Date.now();
      var timeSinceLast = now - lastRequestTime;
      
      if (timeSinceLast >= MIN_INTERVAL) {
        var next = requestQueue.shift();
        lastRequestTime = now;
        next();
        setTimeout(processQueue, MIN_INTERVAL);
      } else {
        setTimeout(processQueue, MIN_INTERVAL - timeSinceLast);
      }
    }

    function queueRequest(fn) {
      return new Promise(function(resolve, reject) {
        requestQueue.push(function() {
          fn().then(resolve).catch(reject);
        });
        processQueue();
      });
    }

    // API 路径前缀列表（这些路径需要代理到后端）
    var API_PREFIXES = [
      '/exchange/', '/api/', '/user/', '/wallet/',
      '/rockieCoin/', '/rockieCoinFutures/', '/rockieCoinOptions/',
      '/Transaction/', '/rockieWalletWithdraw/', '/share/', '/hashMap/',
      '/productGold/', '/nftProduct/', '/telegram/', '/newStockCoinTrade/',
      '/RockieMessage/', '/rockieFile/', '/rockieAi/', '/Home/', '/goldForeign/',
      '/RockieGoldETFController/', '/RockieGoldStockController/',
      '/RockieGoldNewStockController/', '/RockieGoldIndiceController/',
      '/tradingView/', '/cs/', '/stats'
    ];

    function isApiPath(pathname) {
      return API_PREFIXES.some(function(p) {
        return pathname === p.replace(/\/$/, '') || pathname.startsWith(p);
      });
    }

    function proxyUrl(url) {
      if (!PROXY || typeof url !== 'string') return url;
      if (url.indexOf(PROXY) !== -1) return url;

      // 相对路径: /exchange/... → PROXY/exchange/...
      if (url.startsWith('/') && !url.startsWith('//') && !url.startsWith('/static/') && !url.startsWith('/ETH/')) {
        if (isApiPath(url.split('?')[0])) {
          return PROXY + url;
        }
      }

      // 完整 URL（浏览器把相对路径展开后，hostname 是 GitHub Pages）
      try {
        var parsed = new URL(url);
        var isGithub = parsed.hostname === 'cptmarketscoin-ctrl.github.io';
        var isLocalhost = parsed.hostname === 'localhost' || parsed.hostname === '127.0.0.1';
        var isOriginal = parsed.hostname === 'www.klakna.sbs' || parsed.hostname === 'klakna.sbs';

        if ((isGithub || isLocalhost || isOriginal) && isApiPath(parsed.pathname)) {
          return PROXY + parsed.pathname + (parsed.search || '');
        }
      } catch(e) {}

      // localhost 任意端口（回退）
      if (url.match(/https?:\/\/localhost(:\d+)?/)) {
        return url.replace(/https?:\/\/localhost(:\d+)?/, PROXY);
      }

      // 原站域名（回退）
      if (url.match(/https?:\/\/(www\.)?klakna\.sbs/)) {
        return url.replace(/https?:\/\/(www\.)?klakna\.sbs/, PROXY);
      }

      return url;
    }

    // Intercept fetch with queuing
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      var proxiedUrl = proxyUrl(url);
      return queueRequest(function() {
        return origFetch.call(this, proxiedUrl, opts);
      });
    };

    // Intercept XHR with queuing
    var origOpen = XMLHttpRequest.prototype.open;
    var origSend = XMLHttpRequest.prototype.send;
    
    XMLHttpRequest.prototype.open = function(method, url) {
      var args = Array.prototype.slice.call(arguments);
      args[1] = proxyUrl(url);
      return origOpen.apply(this, args);
    };

    XMLHttpRequest.prototype.send = function(body) {
      var xhr = this;
      return queueRequest(function() {
        return new Promise(function(resolve) {
          origSend.call(xhr, body);
          resolve();
        });
      });
    };

    // Intercept WebSocket
    var origWS = window.WebSocket;
    window.WebSocket = function(url, protocols) {
      if (typeof url === 'string') {
        // 直接拦截所有 WebSocket 连接，强制使用后端 Control WS
        if (url.includes('/ws/control') || url.includes('/exchange/ws') || url.includes('klakna')) {
          url = 'wss://api.cptnexus.sbs/ws/control';
        } else {
          url = proxyUrl(url);
          if (url.startsWith('http://')) url = url.replace('http://', 'ws://');
          if (url.startsWith('https://')) url = url.replace('https://', 'wss://');
        }
      }
      return protocols ? new origWS(url, protocols) : new origWS(url);
    };
    window.WebSocket.prototype = origWS.prototype;

    console.log('[PROXY] Proxy installed with rate limiting: ' + PROXY);
  })();
  </script>
