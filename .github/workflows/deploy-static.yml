name: Deploy to GitHub Pages (static)

on:
  push:
    branches: [Folder]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          # Copy ETH contents (app pages/chunks/css)
          cp -r ETH/* _deploy/
          # Copy chunk files from root static/ to _deploy/static/
          mkdir -p _deploy/static
          cp -r static/* _deploy/static/
          # Copy favicon
          cp favicon.ico _deploy/ 2>/dev/null || true
          echo "=== Deploy structure ==="
          find _deploy -maxdepth 2 -type d | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_deploy"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
