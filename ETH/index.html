<script>
// ========== PROXY 层 ==========
var KLAKNA_API_PROXY = 'https://api.cptnexus.sbs';
window.__KLAKNA_PROXY__ = KLAKNA_API_PROXY;

(function(){
  function proxyUrl(url) {
    if (!url) return url;
    if (url.indexOf(KLAKNA_API_PROXY) !== -1) return url;
    if (url.indexOf('#') !== -1) return url;
    if (url.startsWith('data:') || url.startsWith('blob:')) return url;
    var urlPathOnly = url.split('?')[0].split('#')[0];
    if (urlPathOnly.match(/\.(js|css|png|jpg|jpeg|gif|svg|woff|ttf|ico|woff2)(\?|$)/)) return url;
    if (urlPathOnly.indexOf('/static/') !== -1) return url;
    if (url.match(/^https?:\/\//)) {
      var urlPath = url.replace(/^https?:\/\/[^/]+/, '');
      return KLAKNA_API_PROXY + urlPath;
    }
    if (url.startsWith('/')) return KLAKNA_API_PROXY + url;
    return url;
  }

  // 拦截 fetch
  var _fetch = window.fetch;
  window.fetch = function(resource, init) {
    var url = resource instanceof Request ? resource.url : resource;
    if (url) { var n = proxyUrl(url); if (n !== url) arguments[0] = resource instanceof Request ? new Request(n, resource) : n; }
    return _fetch.apply(this, arguments);
  };

  // 拦截 XMLHttpRequest
  var _open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(m, url) {
    if (url) { var n = proxyUrl(url); if (n !== url) arguments[1] = n; }
    return _open.apply(this, arguments);
  };

  // 拦截 WebSocket
  var OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    if (url && typeof url === 'string') {
      var wsu = url;
      if (wsu.match(/^wss?:\/\//)) {
        if (wsu.indexOf('api.cptnexus.sbs') === -1 && wsu.indexOf('infura.io') === -1) {
          wsu = 'wss://api.cptnexus.sbs' + wsu.replace(/^wss?:\/\/[^/]+/, '');
        }
      } else if (wsu.startsWith('/')) {
        wsu = 'wss://api.cptnexus.sbs' + wsu;
      }
      try { return new OrigWS(wsu, protocols); } catch(e) { return { readyState:3, close:function(){}, send:function(){}, addEventListener:function(){} }; }
    }
    return new OrigWS(url, protocols);
  };
  window.WebSocket.prototype = OrigWS.prototype;
  window.WebSocket.CONNECTING = 0; window.WebSocket.OPEN = 1;
  window.WebSocket.CLOSING = 2; window.WebSocket.CLOSED = 3;

  // 拦截 Image src
  var _Image = window.Image;
  window.Image = function(w, h) {
    var img = new _Image(w, h);
    var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src') || Object.getOwnPropertyDescriptor(_Image.prototype, 'src');
    if (d && d.set) {
      Object.defineProperty(img, 'src', {
        get: function(){ return d.get.call(this); },
        set: function(v){ if (v && typeof v === 'string' && v.indexOf('rockieFile/getFile') !== -1) { var nv = proxyUrl(v); if (nv !== v) v = nv; } d.set.call(this, v); }
      });
    }
    return img;
  };
  window.Image.prototype = _Image.prototype;

  console.log('[PROXY] Installed, target:', KLAKNA_API_PROXY);
})();
// ========== Service Worker 注册 ==========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/ETH/sw.js').then(function(r) {
      console.log('[SW] Registered:', r.scope);
    }).catch(function(e) { console.warn('[SW] Failed:', e.message); });
  });
}
</script>
